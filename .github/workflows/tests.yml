name: tests

# Runs the Python contract/build test suite on every PR (and on pushes to main)
# so regressions are caught before merge. The suite uses only the standard
# library, so no dependency install is needed beyond pytest itself.
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pytest
        run: pip install pytest

      - name: Run tests
        run: python -m pytest build/tests -q

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Syntax-check the Worker
        run: node --check worker/src/index.js

      - name: Worker Teams-alert tests
        run: node worker/tests/teams.test.mjs

      - name: Worker asset-KPI publish tests
        run: node worker/tests/kpis.test.mjs

      # Guards the JS half of the KPI report adapters against the Python half
      # (same shared case table as the pytest run above).
      - name: KPI coercion parity (kpi-core.js vs build/kpi_reports.py)
        run: node worker/tests/kpi_coerce.test.mjs

      # Downtime, MTTR and availability are derived in the KPI page only, so they
      # are exercised straight out of kpis.html (the spec comes from kpi-core.js).
      - name: KPI downtime maths (kpis.html)
        run: node worker/tests/kpi_downtime.test.mjs

      # The builder's preview must merge exactly as the real publish does, or it
      # would show numbers the publish wouldn't produce.
      - name: KPI merge parity (builder preview vs worker publish)
        run: node worker/tests/kpi_merge.test.mjs

      # A single incidental column must not hand an unrelated export to a family
      # whose data a publish would then replace.
      - name: KPI family detection floor (kpi-core.js)
        run: node worker/tests/kpi_detect.test.mjs

      # .xlsx part resolution: OOXML attribute order varies by writer, and the
      # real exports put Target before Id / r last. Positional regexes silently
      # read zero rows.
      - name: KPI xlsx part resolution (kpi-core.js)
        run: node worker/tests/kpi_xlsx.test.mjs

      # The whole browser import chain over the same fixtures as Python, held to
      # the committed golden — the end-to-end guard for port divergence.
      - name: KPI import pipeline parity (kpi-core.js vs Python golden)
        run: node worker/tests/kpi_pipeline.test.mjs

      # Every tile has to be able to show its own arithmetic, and that arithmetic
      # has to reconcile to the tile — a KPI nobody can explain is a KPI nobody
      # can defend.
      - name: KPI derivations reconcile to the tiles (kpis.html)
        run: node --test worker/tests/kpi_work.test.mjs

      # The read-only explainer: the Worker's declared tools and the page's
      # implementations have to stay paired, the tools must stay pure reads, and
      # the relay must never accept a prompt or a tool list from the client.
      - name: KPI explainer tools and payload guard (worker + kpis.html)
        run: node --test worker/tests/ask_tools.test.mjs
